services:
  postgres:
    image: postgres:17
    container_name: robofleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robofleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robofleet_password}
      POSTGRES_DB: ${POSTGRES_DB:-robofleet_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robofleet -d robofleet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robofleet-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://robofleet:robofleet_password@postgres:5432/robofleet_db?sslmode=disable
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
    ports:
      - "8080:8080"

volumes:
  postgres_data: